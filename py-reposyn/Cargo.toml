[package]
name = "py-reposyn"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "py_reposyn"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.23.3"
git2 = "0.20.0"
time = "0.3"
ignore = "0.4.10"
clap = { version = "4.0", features = ["derive"] }
copypasta = "0.10"
glob-match = "0.2.1"
